<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>目标点云观察</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf2f7;font:15px system-ui,sans-serif}
header{padding:20px 28px;border-bottom:1px solid #2b3543;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}p{color:#a7b5c6;line-height:1.6;margin:8px 0}
.tag{font-size:13px;color:#7ee0ad;border:1px solid #396b54;border-radius:20px;padding:5px 11px}
.controls{padding:18px 28px;display:flex;align-items:end;gap:16px;flex-wrap:wrap}.field label{display:block;color:#9aaabc;font-size:12px;margin-bottom:6px}
select,button{background:#202a38;color:#edf2f7;border:1px solid #3c4b60;border-radius:7px;padding:9px 12px;font:inherit}select{max-width:min(430px,calc(100vw - 56px))}button{cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(400px,1.35fr);gap:16px;padding:0 28px 16px}
.card{background:#19212c;border:1px solid #303c4a;border-radius:12px;padding:16px;min-width:0}
.imagebox,.cloudbox{height:440px;background:#0a0f16;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
img{max-width:100%;max-height:100%;object-fit:contain}canvas{width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}
.stats{display:flex;gap:25px;flex-wrap:wrap;padding:0 28px 22px}.metric{min-width:135px}.metric small{color:#9aaabc}.metric strong{display:block;margin-top:5px;font-size:18px}.warning{color:#ffc985}
@media(max-width:900px){.grid{grid-template-columns:1fr}.imagebox,.cloudbox{height:280px}header{padding:14px 20px}.controls{padding:12px 20px;gap:10px}.grid{padding:0 20px 12px}.stats{padding:0 20px 18px}}
</style></head><body><header><div><h1>目标点云观察</h1><p>查看识别区域和相机坐标系中的三维点</p></div><span class="tag">只读 · 不控制机械臂</span></header>
<div class="controls"><div class="field"><label>数据来源</label><select id="source"><option value="live">实时相机</option></select></div>
<div class="field"><label>目标选择</label><select id="color"><option value="yolo">YOLO 物体识别</option><option value="red">红色</option><option value="point">点击图像选目标（不限颜色）</option><option value="orange">橙色</option><option value="yellow">黄色</option><option value="green">绿色</option><option value="blue">蓝色</option><option value="purple">紫色</option><option value="saved">历史帧原始掩码</option></select></div>
<div class="field"><label>点云显示</label><select id="display"><option value="target">仅目标</option><option value="both">场景 + 目标</option><option value="scene">仅场景</option></select></div>
<div class="field"><label>识别出的物体</label><select id="instances"><option value="">请先识别</option></select></div><button id="detect">识别当前画面</button><button id="refresh">刷新</button><span id="status">等待相机连接…</span></div>
<main class="grid"><section class="card"><h2>相机图像与识别区域</h2><div class="imagebox"><img id="image" alt="等待相机图像"></div><p>选择“点击图像选目标”后，点击物体内部。实时点选会锁定当前帧；点击“刷新”重新观察。深度相近或相接的背景可能被包含。YOLO 识别后可选择实例，结果锁定在识别时的画面。</p></section>
<section class="card"><h2>三维点云</h2><div class="cloudbox"><canvas id="cloud"></canvas></div><p>黄色为识别目标；拖动旋转，滚轮缩放。坐标为相机光学坐标：X 向右、Y 向下、Z 向前。</p></section></main>
<div class="stats"><div class="metric"><small>有效深度点</small><strong id="valid">—</strong></div><div class="metric"><small>识别目标点</small><strong id="count">—</strong></div><div class="metric"><small>点选像素 X，Y</small><strong id="pixel">—</strong></div><div class="metric"><small>可见表面中位坐标 · 米</small><strong id="center">—</strong></div><div class="metric"><small>数据来源</small><strong id="label">—</strong></div></div>
<script>
const source=document.getElementById('source'), color=document.getElementById('color'), display=document.getElementById('display'), statusEl=document.getElementById('status'), canvas=document.getElementById('cloud'), ctx=canvas.getContext('2d');
let cloud=null, yaw=-0.5, pitch=0.35, zoom=5, dragging=false, px=0, py=0, busy=false, pending=false, picked=null, selectedFrame=null, detectionId=null;
const instances=document.getElementById('instances'), detectButton=document.getElementById('detect');
function draw(){const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a0f16';ctx.fillRect(0,0,w,h);if(!cloud)return;
const target=cloud.center||[0,0,0.5], cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
const project=p=>{let x=p[0]-target[0],y=p[1]-target[1],z=p[2]-target[2],x1=cy*x+sy*z,z1=-sy*x+cy*z,y1=cp*y-sp*z1;return [w/2+x1*w*zoom,h/2+y1*w*zoom]};
if(display.value!=='target'){for(let i=0;i<cloud.scene.length;i++){let p=project(cloud.scene[i]);if(p[0]<0||p[0]>w||p[1]<0||p[1]>h)continue;let c=cloud.scene_rgb[i];ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},.45)`;ctx.fillRect(p[0],p[1],1.5,1.5)}}
if(display.value!=='scene'){ctx.fillStyle='#ffca51';for(const p of cloud.target){let q=project(p);ctx.fillRect(q[0]-1,q[1]-1,2.5,2.5)}}
if(cloud.center){let p=project(cloud.center);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p[0]-8,p[1]);ctx.lineTo(p[0]+8,p[1]);ctx.moveTo(p[0],p[1]-8);ctx.lineTo(p[0],p[1]+8);ctx.stroke()}}
async function update(){if(busy){pending=true;return}busy=true;const query=new URLSearchParams({source:source.value,color:color.value});if(picked){query.set('x',picked[0]);query.set('y',picked[1])}if(selectedFrame)query.set('frame_id',selectedFrame);if(color.value==='yolo'&&detectionId){query.set('detection_id',detectionId);query.set('instance',instances.value)}try{let res=await fetch('/api/cloud?'+query,{cache:'no-store'}),d=await res.json();if(!res.ok)throw Error(d.error);cloud=d;draw();const imageQuery=new URLSearchParams(query);if(d.frame_id)imageQuery.set('frame_id',d.frame_id);document.getElementById('image').src='/api/image?'+imageQuery+'&t='+Date.now();document.getElementById('valid').textContent=d.valid_count.toLocaleString();document.getElementById('count').textContent=d.target_count.toLocaleString();document.getElementById('center').textContent=d.center?d.center.map(x=>x.toFixed(3)).join('，'):'未识别';document.getElementById('label').textContent=d.label.startsWith('历史记录')?'历史帧':d.label;statusEl.textContent=color.value==='yolo'&&!detectionId?'点击识别当前画面':color.value==='point'&&!picked?'请点击图像中的目标':(selectedFrame?'已锁定点选帧，点击刷新重新观察':(d.age_s!==null?(d.age_s>3?`数据已停更 ${d.age_s} 秒`:'实时更新中'):'历史帧'));statusEl.className=!selectedFrame&&d.age_s!==null&&d.age_s>3?'warning':''}catch(e){statusEl.textContent=e.message;statusEl.className='warning'}finally{busy=false;if(pending){pending=false;update()}}}
fetch('/api/frames').then(r=>r.json()).then(items=>{for(const f of items){let o=document.createElement('option');o.value=f.id;o.textContent=f.label;source.appendChild(o)}});
function resetSelection(){picked=null;selectedFrame=null;detectionId=null;instances.replaceChildren(new Option('请先识别',''));document.getElementById('pixel').textContent='—'}
source.onchange=()=>{resetSelection();update()};color.onchange=()=>{resetSelection();update()};display.onchange=draw;document.getElementById('refresh').onclick=()=>{resetSelection();update()};instances.onchange=update;
const imageEl=document.getElementById('image');imageEl.onload=()=>{imageEl.dataset.frameId=new URL(imageEl.currentSrc).searchParams.get('frame_id')||''};
detectButton.onclick=async()=>{const requestedSource=source.value;const fid=requestedSource==='live'?imageEl.dataset.frameId:null;if(requestedSource==='live'&&!fid){statusEl.textContent='请等待图像加载';return} selectedFrame=fid;detectButton.disabled=true;statusEl.textContent='正在识别当前画面…';try{const res=await fetch('/api/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:requestedSource,frame_id:fid})});const d=await res.json();if(!res.ok)throw Error(d.error);if(source.value!==requestedSource){resetSelection();return}instances.replaceChildren();d.items.forEach((item,i)=>instances.add(new Option(`${item.name} · ${(item.confidence*100).toFixed(0)}%`,i)));if(!d.items.length){resetSelection();statusEl.textContent='没有识别到已知类别，可尝试点击选点';return}detectionId=d.detection_id;color.value='yolo';update()}catch(e){resetSelection();statusEl.textContent=e.message;statusEl.className='warning'}finally{detectButton.disabled=false}};
imageEl.onclick=e=>{if(color.value!=='point')return;const r=e.currentTarget.getBoundingClientRect();picked=[Math.floor((e.clientX-r.left)/r.width*e.currentTarget.naturalWidth),Math.floor((e.clientY-r.top)/r.height*e.currentTarget.naturalHeight)];selectedFrame=source.value==='live'?e.currentTarget.dataset.frameId:null;document.getElementById('pixel').textContent=picked.join('，');update()};
canvas.onpointerdown=e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointermove=e=>{if(!dragging)return;yaw+=(e.clientX-px)*.01;pitch+=(e.clientY-py)*.01;px=e.clientX;py=e.clientY;draw()};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()};window.onresize=draw;setInterval(()=>{if(source.value==='live'&&!selectedFrame)update()},1800);update();
</script></body></html>
